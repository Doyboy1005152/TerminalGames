name: Update public installer release
on:
  push:
    branches: [main]
    paths:
      - 'install-windows.bat'
      - 'install-mac.command'
      - 'install-linux.sh'
      - '.github/workflows/update-installers.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-installer-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the exact repository commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Validate standalone installers
        shell: bash
        run: |
          set -euo pipefail
          bash -n install-linux.sh
          bash -n install-mac.command
          test -s install-windows.bat
          test -s install-mac.command
          test -s install-linux.sh
      - name: Update existing public release attachments
        shell: bash
        run: |
          set -euo pipefail
          # Keep the existing release title, notes, tag and public game version.
          gh release view Release >/dev/null
          mkdir -p release-assets
          cp install-windows.bat install-mac.command install-linux.sh release-assets/
          gh release upload Release release-assets/* --clobber
          mkdir -p verify-assets
          for file in release-assets/*; do
            name="${file##*/}"
            gh release download Release --pattern "$name" --dir verify-assets
            cmp "$file" "verify-assets/$name"
          done
          # Keep only the three current installers; remove superseded duplicates.
          gh release view Release --json assets --jq '.assets[].name' > "$RUNNER_TEMP/existing-assets.txt"
          for obsolete in terminal-games-installers.zip Terminal-Games-Installers.zip INSTALL.WINDOWS.bat INSTALL.MAC.command INSTALL.LINUX.sh; do
            if grep -Fxq "$obsolete" "$RUNNER_TEMP/existing-assets.txt"; then
              gh release delete-asset Release "$obsolete" --yes
            fi
          done
          echo 'Three standalone installers uploaded and verified.' >> "$GITHUB_STEP_SUMMARY"
